        }).join('') + '</div>';
      if (!top) return '<div class="card seg-card"><div class="r">' + p[1] + '</div><div class="campeao">–</div><div class="nota" style="margin:0">Nenhum segmento com 10% da verba gerou ' + r[1] + '.</div>' + lista + '</div>';
      return '<div class="card seg-card"><div class="r">' + p[1] + '</div><div class="campeao">' + esc(top.valor) + '</div>' +
        '<div class="pares"><div><div class="k">Custo por ' + r[0] + '</div><div class="v">' + brl(top.custo_resultado) + '</div></div>' +
        '<div><div class="k">Participação da verba</div><div class="v">' + pct(top.participacao, 1) + '</div></div></div>' +
        '<div class="meter" aria-hidden="true"><i style="width:' + (top.participacao * 100).toFixed(1) + '%"></i></div>' + lista + '</div>';
    }).join('') + '</div>';
  }

  iniciar();
})();
</script>
</body>
</html>
